<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Space Fighter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #0ff;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }

    /* HUD */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
      font-weight: 600;
      letter-spacing: 1px;
    }
    .hud-box {
      background: rgba(0, 15, 30, 0.45);
      border: 1px solid rgba(0, 255, 255, 0.35);
      padding: 8px 14px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 34px;
      height: 34px;
      transform: translate(-50%, -50%);
      border: 1.5px solid rgba(0, 255, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(0, 255, 255, 0.8);
    }
    #crosshair::before { top: 50%; left: 50%; width: 4px; height: 4px; transform: translate(-50%, -50%); border-radius: 50%; }

    #hint {
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 4px;
    }

    /* Mobile Touch Controls */
    #joystick-zone {
      position: fixed;
      bottom: 28px;
      left: 28px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(0, 255, 255, 0.08);
      border: 2px solid rgba(0, 255, 255, 0.3);
      pointer-events: auto;
      display: none;
    }
    #joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 48px;
      height: 48px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(0, 255, 255, 0.45);
      border: 2px solid #0ff;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
    }
    #action-buttons {
      position: fixed;
      bottom: 32px;
      right: 28px;
      display: none;
      flex-direction: column;
      gap: 14px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid #0ff;
      background: rgba(0, 255, 255, 0.15);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.35);
    }
    .touch-btn.fire {
      border-color: #ff3b5c;
      background: rgba(255, 59, 92, 0.22);
      box-shadow: 0 0 14px rgba(255, 59, 92, 0.45);
    }
    .touch-btn:active { transform: scale(0.92); }

    @media (pointer: coarse), (max-width: 900px) {
      #joystick-zone { display: block; }
      #action-buttons { display: flex; }
      #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-top">
      <div class="hud-box">SCORE: <span id="score">0</span></div>
      <div class="hud-box">SPEED: <span id="speed">120</span> m/s</div>
    </div>
    <div id="hint">WASD / Pfeile: Fliegen · Leertaste / Klick: Laser · Shift: Boost</div>
  </div>
  <div id="crosshair"></div>

  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div id="action-buttons">
    <div id="btn-boost" class="touch-btn">BOOST</div>
    <div id="btn-fire" class="touch-btn fire">FEUER</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    // --- Web Audio Synth (Laser & Explosion) ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playLaser() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(160, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.13);
    }
    function playExplosion() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(28, audioCtx.currentTime + 0.28);
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // --- Szene, Kamera, Renderer ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02040a, 0.0018);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Licht
    scene.add(new THREE.AmbientLight(0x334466, 1.4));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(100, 150, 80);
    scene.add(sun);

    // --- Raumjäger bauen ---
    const ship = new THREE.Group();
    const shipModel = new THREE.Group(); // separates Mesh-Kind für sanftes Neigen
    ship.add(shipModel);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd8e2ec, metalness: 0.7, roughness: 0.25 });
    const wingMat = new THREE.MeshStandardMaterial({ color: 0x3a4a63, metalness: 0.6, roughness: 0.35 });
    const cockpitMat = new THREE.MeshStandardMaterial({ color: 0x00d9ff, emissive: 0x005577, metalness: 0.9, roughness: 0.1 });
    const engineMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

    // Rumpf
    const fuselage = new THREE.Mesh(new THREE.ConeGeometry(0.7, 4.6, 6), bodyMat);
    fuselage.rotation.x = -Math.PI / 2;
    shipModel.add(fuselage);

    // Cockpit
    const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 12), cockpitMat);
    cockpit.scale.set(0.8, 0.6, 1.8);
    cockpit.position.set(0, 0.35, -0.2);
    shipModel.add(cockpit);

    // Hauptflügel
    const wings = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.12, 1.4), wingMat);
    wings.position.set(0, -0.05, 0.7);
    shipModel.add(wings);

    // Heckflosse
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.1, 1.0), wingMat);
    tail.position.set(0, 0.55, 1.6);
    shipModel.add(tail);

    // Zwillings-Triebwerke
    const engineGeo = new THREE.CylinderGeometry(0.22, 0.28, 0.6, 10);
    engineGeo.rotateX(Math.PI / 2);
    const engineL = new THREE.Mesh(engineGeo, engineMat);
    engineL.position.set(-0.55, -0.05, 2.2);
    const engineR = engineL.clone();
    engineR.position.x = 0.55;
    shipModel.add(engineL, engineR);

    scene.add(ship);

    // --- Sternenfeld (wraps um den Jäger) ---
    const STAR_COUNT = 1600;
    const STAR_RANGE = 500;
    const starPositions = new Float32Array(STAR_COUNT * 3);
    for (let i = 0; i < STAR_COUNT; i++) {
      starPositions[i * 3] = (Math.random() - 0.5) * STAR_RANGE;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * STAR_RANGE;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * STAR_RANGE;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, sizeAttenuation: true });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // --- Ziele (Asteroiden & feindliche Drohnen) ---
    const targets = [];
    const asteroidGeo = new THREE.DodecahedronGeometry(3.2, 0);
    const asteroidMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.9, flatShading: true });
    const droneGeo = new THREE.OctahedronGeometry(2.6, 0);
    const droneMat = new THREE.MeshStandardMaterial({ color: 0xff3b5c, emissive: 0x550011, metalness: 0.5, roughness: 0.3 });

    function spawnTarget(mesh, aheadOnly = false) {
      const dist = 120 + Math.random() * 260;
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(ship.quaternion);
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(ship.quaternion);
      const up = new THREE.Vector3(0, 1, 0).applyQuaternion(ship.quaternion);

      const spread = aheadOnly ? 140 : 220;
      const pos = ship.position.clone()
        .addScaledVector(forward, aheadOnly ? dist : (Math.random() - 0.3) * 320)
        .addScaledVector(right, (Math.random() - 0.5) * spread)
        .addScaledVector(up, (Math.random() - 0.5) * spread);

      mesh.position.copy(pos);
      mesh.userData.rotSpeed = new THREE.Vector3(
        (Math.random() - 0.5) * 0.02,
        (Math.random() - 0.5) * 0.02,
        (Math.random() - 0.5) * 0.02
      );
    }

    for (let i = 0; i < 45; i++) {
      const isDrone = i % 3 === 0;
      const mesh = new THREE.Mesh(isDrone ? droneGeo : asteroidGeo, isDrone ? droneMat : asteroidMat);
      const scale = isDrone ? 1.1 : (0.7 + Math.random() * 1.4);
      mesh.scale.setScalar(scale);
      mesh.userData.radius = (isDrone ? 2.8 : 3.2) * scale;
      mesh.userData.points = isDrone ? 250 : 100;
      spawnTarget(mesh, false);
      scene.add(mesh);
      targets.push(mesh);
    }

    // --- Laser & Explosionen ---
    const lasers = [];
    const explosions = [];
    const laserGeo = new THREE.CylinderGeometry(0.1, 0.1, 4.5, 6);
    laserGeo.rotateX(Math.PI / 2);
    const laserMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa });

    let lastShot = 0;
    function fireLasers() {
      const now = performance.now();
      if (now - lastShot < 140) return;
      lastShot = now;
      initAudio();
      playLaser();

      [-2.1, 2.1].forEach((offsetX) => {
        const bolt = new THREE.Mesh(laserGeo, laserMat);
        const startPos = new THREE.Vector3(offsetX, -0.1, -1.5).applyQuaternion(ship.quaternion).add(ship.position);
        bolt.position.copy(startPos);
        bolt.quaternion.copy(ship.quaternion);
        const velocity = new THREE.Vector3(0, 0, -1).applyQuaternion(ship.quaternion).multiplyScalar(7.5);
        bolt.userData = { velocity, life: 70 };
        scene.add(bolt);
        lasers.push(bolt);
      });
    }

    const expGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
    function spawnExplosion(pos, color) {
      playExplosion();
      for (let i = 0; i < 18; i++) {
        const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
        const p = new THREE.Mesh(expGeo, mat);
        p.position.copy(pos);
        p.userData = {
          vel: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(0.6 + Math.random() * 1.4),
          life: 35
        };
        scene.add(p);
        explosions.push(p);
      }
    }

    // --- Eingaben (Tastatur, Maus, Touch) ---
    const keys = {};
    let isFiring = false;
    let isBoosting = false;
    let joyX = 0, joyY = 0;

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') isFiring = true;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') isBoosting = true;
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Space') isFiring = false;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') isBoosting = false;
    });
    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) { initAudio(); isFiring = true; }
    });
    window.addEventListener('mouseup', () => { isFiring = false; });

    // Virtueller Touch-Joystick
    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    let joyTouchId = null;

    function updateJoystick(clientX, clientY) {
      const rect = joyZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const maxR = rect.width / 2 - 12;
      let dx = clientX - cx;
      let dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
      joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      joyX = dx / maxR;
      joyY = dy / maxR;
    }

    joyZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      initAudio();
      const t = e.changedTouches[0];
      joyTouchId = t.identifier;
      updateJoystick(t.clientX, t.clientY);
    }, { passive: false });

    joyZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier === joyTouchId) updateJoystick(t.clientX, t.clientY);
      }
    }, { passive: false });

    const resetJoy = (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === joyTouchId) {
          joyTouchId = null;
          joyX = 0; joyY = 0;
          joyKnob.style.transform = 'translate(-50%, -50%)';
        }
      }
    };
    joyZone.addEventListener('touchend', resetJoy);
    joyZone.addEventListener('touchcancel', resetJoy);

    // Touch-Buttons
    const btnFire = document.getElementById('btn-fire');
    const btnBoost = document.getElementById('btn-boost');
    btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); isFiring = true; }, { passive: false });
    btnFire.addEventListener('touchend', () => { isFiring = false; });
    btnBoost.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; }, { passive: false });
    btnBoost.addEventListener('touchend', () => { isBoosting = false; });

    // --- Game Loop ---
    let score = 0;
    let currentSpeed = 1.2;
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const camUp = new THREE.Vector3(0, 1, 0);

    function animate() {
      requestAnimationFrame(animate);

      // Steuerung zusammenführen
      let inputX = joyX;
      let inputY = joyY;
      if (keys['KeyA'] || keys['ArrowLeft']) inputX = -1;
      if (keys['KeyD'] || keys['ArrowRight']) inputX = 1;
      if (keys['KeyW'] || keys['ArrowUp']) inputY = -1;
      if (keys['KeyS'] || keys['ArrowDown']) inputY = 1;

      // Jäger drehen & fliegen
      ship.rotateY(-inputX * 0.032);
      ship.rotateX(-inputY * 0.028);

      // Visuelles Rollen (Banking) des Jäger-Modells
      shipModel.rotation.z = THREE.MathUtils.lerp(shipModel.rotation.z, -inputX * 0.55, 0.12);
      shipModel.rotation.x = THREE.MathUtils.lerp(shipModel.rotation.x, -inputY * 0.2, 0.12);

      // Boost & Geschwindigkeit
      const targetSpeed = isBoosting ? 2.6 : 1.15;
      currentSpeed = THREE.MathUtils.lerp(currentSpeed, targetSpeed, 0.08);
      ship.translateZ(-currentSpeed);

      const targetFov = isBoosting ? 84 : 70;
      camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, 0.08);
      camera.updateProjectionMatrix();
      engineMat.color.setHex(isBoosting ? 0xffaa00 : 0x00ffff);
      speedEl.textContent = Math.round(currentSpeed * 100);

      // Verfolgerkamera sanft nachführen
      const camOffset = new THREE.Vector3(0, 3.2, 11.5).applyQuaternion(ship.quaternion).add(ship.position);
      camera.position.lerp(camOffset, 0.14);
      const desiredUp = new THREE.Vector3(0, 1, 0).applyQuaternion(ship.quaternion);
      camUp.lerp(desiredUp, 0.08);
      camera.up.copy(camUp);
      const lookTarget = new THREE.Vector3(0, 0, -25).applyQuaternion(ship.quaternion).add(ship.position);
      camera.lookAt(lookTarget);

      // Sterne um das Schiff wrappen
      const posArr = starGeo.attributes.position.array;
      const half = STAR_RANGE / 2;
      for (let i = 0; i < STAR_COUNT; i++) {
        const ix = i * 3, iy = ix + 1, iz = ix + 2;
        if (posArr[ix] - ship.position.x > half) posArr[ix] -= STAR_RANGE;
        else if (posArr[ix] - ship.position.x < -half) posArr[ix] += STAR_RANGE;
        if (posArr[iy] - ship.position.y > half) posArr[iy] -= STAR_RANGE;
        else if (posArr[iy] - ship.position.y < -half) posArr[iy] += STAR_RANGE;
        if (posArr[iz] - ship.position.z > half) posArr[iz] -= STAR_RANGE;
        else if (posArr[iz] - ship.position.z < -half) posArr[iz] += STAR_RANGE;
      }
      starGeo.attributes.position.needsUpdate = true;

      // Feuern
      if (isFiring) fireLasers();

      // Laser bewegen & Kollision prüfen
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.position.add(l.userData.velocity);
        l.userData.life--;

        let hit = false;
        for (const t of targets) {
          if (l.position.distanceTo(t.position) < t.userData.radius + 1.2) {
            score += t.userData.points;
            scoreEl.textContent = score;
            spawnExplosion(t.position, t.userData.points > 100 ? 0xff3b5c : 0xffaa44);
            spawnTarget(t, true);
            hit = true;
            break;
          }
        }
        if (hit || l.userData.life <= 0) {
          scene.remove(l);
          lasers.splice(i, 1);
        }
      }

      // Ziele drehen & weit entfernte neu vor dir spawnen
      for (const t of targets) {
        t.rotation.x += t.userData.rotSpeed.x;
        t.rotation.y += t.userData.rotSpeed.y;
        if (t.position.distanceTo(ship.position) > 360) {
          spawnTarget(t, true);
        }
      }

      // Explosionen updaten
      for (let i = explosions.length - 1; i >= 0; i--) {
        const p = explosions[i];
        p.position.add(p.userData.vel);
        p.userData.life--;
        p.material.opacity = p.userData.life / 35;
        if (p.userData.life <= 0) {
          scene.remove(p);
          p.material.dispose();
          explosions.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
